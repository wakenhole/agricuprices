name: Test Walmart & JD Crawling

on:
  workflow_dispatch:  # 수동으로만 실행

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run Walmart & JD basic test (requests)
        run: python crawler/test_walmart_jd.py

      - name: Run Playwright + USDA test
        run: python crawler/test_playwright_jd_walmart.py
