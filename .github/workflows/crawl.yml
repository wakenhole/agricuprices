name: Crawl Prices

on:
  schedule:
    # 매일 오전 6시 KST (= 21:00 UTC 전날)
    - cron: '0 21 * * *'
  workflow_dispatch:  # 수동 실행 가능

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: crawler/requirements.txt

      - name: Install Python dependencies
        run: pip install -r crawler/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Run crawler
        run: python crawler/crawl.py

      - name: Commit updated price data
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add public/data/prices.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "data: update prices $(date -u +%Y-%m-%d)"
          git push
